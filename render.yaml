databases:
  - name: tierlist-db
    plan: free
    databaseName: tierlist
    user: tierlist

services:
  - type: redis
    name: tierlist-redis
    plan: free
    maxmemoryPolicy: noeviction

  - type: web
    name: tierlist-backend
    env: node
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tierlist-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: tierlist-redis
          type: redis
          property: connectionString
      - key: NODE_ENV
        value: production

  - type: web
    name: tierlist-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://tierlist-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
